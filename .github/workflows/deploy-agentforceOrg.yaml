name: Deploy to AgentforceOrg

on:
  push:
    branches:
      - AgentforceOrg1
      - AizadaDev2
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy-to-agentforce:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'AizadaDev2' && 'student-dev2' || 'AgentforceOrg' }}  # GitHub Environment with your org secrets

    steps:
      # Set up Node.js
      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Checkout the repository
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Needed for sfdx-git-delta

      # Install Salesforce CLI globally
      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      # 4️⃣ Install sfdx-git-delta plugin
      - name: Install sfdx-git-delta
        run: |
          echo Y | sf plugins install sfdx-git-delta
          sf plugins

      # Generate delta package for changed metadata
      - name: Create delta packages
        run: |
          mkdir -p changed-sources
          sf sgd source delta \
            --to "HEAD" \
            --from "HEAD~1" \
            --output changed-sources/ \
            --generate-delta \
            --source force-app/
          echo "[INFO] Delta package generated"

      # Authenticate to AgentforceOrg using JWT
      - name: Authenticate with JWT
        run: |
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
          sf org login jwt \
            --username "${{ secrets.DEPLOYMENT_USER_NAME }}" \
            --jwt-key-file server.key \
            --client-id "${{ secrets.CONSUMER_KEY }}" \
            --instance-url "${{ vars.INSTANCE_URL }}" \
            --set-default

      # Deploy changed metadata to AgentforceOrg
      - name: Deploy to AgentforceOrg
        run: |
          if [ ! -d "changed-sources/force-app" ] || [ -z "$(ls -A changed-sources/force-app 2>/dev/null)" ]; then
            echo "[INFO] No metadata changes detected. Skipping deploy."
            exit 0
          fi

          sf project deploy start \
            --source-dir changed-sources/force-app \
            --test-level RunLocalTests \
            --wait 60

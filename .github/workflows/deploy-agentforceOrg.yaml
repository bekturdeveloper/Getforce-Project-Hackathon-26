name: Deploy to AgentforceOrg

on:
  push:
    branches:
      - AgentforceOrg1
  workflow_dispatch:

jobs:
  deploy-to-agentforce:
    runs-on: ubuntu-latest
    environment: AgentforceOrg

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Install sfdx-git-delta
        run: |
          echo Y | sf plugins install sfdx-git-delta
          sf plugins

      - name: Fetch all branches
        run: git fetch --all

      - name: Create delta package
        run: |
          mkdir -p changed-sources
          sf sgd source delta \
            --from origin/main \
            --to HEAD \
            --output changed-sources \
            --generate-delta \
            --source force-app

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
          sf org login jwt \
            --username "${{ secrets.DEPLOYMENT_USER_NAME }}" \
            --jwt-key-file server.key \
            --client-id "${{ secrets.CONSUMER_KEY }}" \
            --instance-url "${{ vars.INSTANCE_URL }}" \
            --set-default

      - name: Deploy metadata
        run: |
          if [ ! -d "changed-sources/force-app" ] || [ -z "$(ls -A changed-sources/force-app 2>/dev/null)" ]; then
            echo "[INFO] No metadata changes detected."
            exit 0
          fi

          sf project deploy start \
            --source-dir changed-sources/force-app \
            --test-level RunLocalTests \
            --wait 60

name: Quick Deploy (after merge)

on:
  push:
    branches: [ stage, main ]
    paths:
      - 'force-app/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quick_deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'sffnoobs' || 'stage' }}

    steps:
      - name: Checkout merged branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Authenticate (JWT)
        run: |
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
          sf org login jwt \
            --username "${{ secrets.DEPLOYMENT_USER_NAME }}" \
            --jwt-key-file server.key \
            --client-id "${{ secrets.CONSUMER_KEY }}" \
            --instance-url "${{ vars.INSTANCE_URL }}" \
            --set-default

      - name: Quick deploy using PR validation job id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          SHA="${{ github.sha }}"
          echo "[INFO] Commit SHA: ${SHA}"
          echo "[INFO] Branch: ${{ github.ref_name }}"

          # Find PR(s) associated to this commit
          PR_NUMBER="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${SHA}/pulls" \
            | node -p "const a=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log((a && a[0] && a[0].number) ? a[0].number : '')")"

          if [ -z "${PR_NUMBER}" ]; then
            echo "[WARN] No PR found for this commit. Falling back to normal deploy."
            sf project deploy start --source-dir force-app --wait 60
            exit 0
          fi

          echo "[INFO] Found PR: #${PR_NUMBER}"

          # Read PR comments and extract last SF_VALIDATION_JOB_ID
          JOB_ID="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" \
            | node -p "
              const c=JSON.parse(require('fs').readFileSync(0,'utf8'));
              const hits=c.map(x=>x.body||'').filter(b=>b.includes('SF_VALIDATION_JOB_ID='));
              if(!hits.length){ console.log(''); process.exit(0); }
              const last=hits[hits.length-1];
              const m=last.match(/SF_VALIDATION_JOB_ID=([A-Za-z0-9]+)/);
              console.log(m?m[1]:'');
            ")"

          if [ -z "${JOB_ID}" ]; then
            echo "[WARN] No SF_VALIDATION_JOB_ID found in PR comments. Falling back to normal deploy."
            sf project deploy start --source-dir force-app --wait 60
            exit 0
          fi

          echo "[INFO] Quick deploying using job id: ${JOB_ID}"
          sf project deploy quick --job-id "${JOB_ID}" --wait 60

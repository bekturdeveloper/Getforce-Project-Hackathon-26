name: Validate Salesforce Deploy (PR)

on:
  pull_request:
    branches: [ stage, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'force-app/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.base_ref == 'main' && 'sffnoobs' || 'stage' }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Install sfdx-git-delta
        run: |
          echo Y | sf plugins install sfdx-git-delta
          sf plugins

      - name: Create delta package (PR base -> PR head)
        run: |
          mkdir -p changed-sources
          sf sgd source delta \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to   "${{ github.event.pull_request.head.sha }}" \
            --output changed-sources/ \
            --generate-delta \
            --source force-app/
          echo "[INFO] Diff generated"

      - name: Authenticate (JWT)
        run: |
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
          sf org login jwt \
            --username "${{ secrets.DEPLOYMENT_USER_NAME }}" \
            --jwt-key-file server.key \
            --client-id "${{ secrets.CONSUMER_KEY }}" \
            --instance-url "${{ vars.INSTANCE_URL }}" \
            --set-default

      - name: Validate (async) and comment job id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "changed-sources/force-app" ] || [ -z "$(ls -A changed-sources/force-app 2>/dev/null)" ]; then
            echo "[INFO] No metadata changes detected. Skipping validation."
            exit 0
          fi

          # stage => NoTestRun, main => RunLocalTests
          if [ "${{ github.base_ref }}" = "main" ]; then
            TEST_LEVEL="RunLocalTests"
          else
            TEST_LEVEL="NoTestRun"
          fi

          echo "[INFO] Validating with test level: ${TEST_LEVEL}"

          # Start async validation -> capture job id
          JOB_ID="$(sf project deploy validate \
            --source-dir changed-sources/force-app \
            --test-level "${TEST_LEVEL}" \
            --async \
            --json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).result.id")"

          echo "[INFO] Validation job id: ${JOB_ID}"

          # Wait for completion (fail if validation fails)
          sf project deploy report --job-id "${JOB_ID}" --wait 60

          # Write comment into PR so the push workflow can quick-deploy later
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "SF_VALIDATION_JOB_ID=${JOB_ID}"

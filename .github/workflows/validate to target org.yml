name: Validate Salesforce Deploy (PR)
run-name: ${{ github.base_ref == 'stage' && 'Validating to UAT' || 'Validating to PROD' }}

on:
  pull_request:
    branches: [ stage, main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths:
      - 'force-app/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.base_ref == 'main' && 'sffnoobs' || 'stage' || 'ElamanDev' }}


    steps:
      - name: Checkout PR head
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Install sfdx-git-delta
        run: |
          echo Y | sf plugins install sfdx-git-delta
          sf plugins

      - name: Create delta package (PR base -> PR head)
        run: |
          set -e
          mkdir -p changed-sources
          sf sgd source delta \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to   "${{ github.event.pull_request.head.sha }}" \
            --output changed-sources/ \
            --generate-delta \
            --source force-app/
          echo "[INFO] Diff generated"

      - name: Authenticate (JWT)
        run: |
          set -e
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
          sf org login jwt \
            --username "${{ secrets.DEPLOYMENT_USER_NAME }}" \
            --jwt-key-file server.key \
            --client-id "${{ secrets.CONSUMER_KEY }}" \
            --instance-url "${{ vars.INSTANCE_URL }}" \
            --set-default

      - name: Validate only (no deploy)
        shell: bash
        run: |
          set -e

          if [ ! -d "changed-sources/force-app" ] || [ -z "$(ls -A changed-sources/force-app 2>/dev/null)" ]; then
            echo "[INFO] No metadata changes detected. Skipping validation."
            exit 0
          fi

          BASE_REF="${{ github.base_ref }}"
          echo "[INFO] PR base branch: ${BASE_REF}"

          if [ "${BASE_REF}" = "stage" ]; then
            echo "[INFO] Stage/UAT: validate without running tests (NoTestRun)"
            sf project deploy start \
              --dry-run \
              --source-dir changed-sources/force-app \
              --test-level NoTestRun \
              --wait 60
          else
            echo "[INFO] Main/Prod: validate with RunLocalTests"
            sf project deploy validate \
              --source-dir changed-sources/force-app \
              --test-level RunLocalTests \
              --wait 60
          fi

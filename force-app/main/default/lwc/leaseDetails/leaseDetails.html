<template>
    <lightning-card title="Lease Details">
        <div class="slds-p-around_medium">

            <lightning-input
                type="date"
                name = 'startDate'
                label="Start Date"
                value={startDate}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                type="date"
                label="End Date"
                name = 'endDate'
                value={endDate}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                type="number"
                label="Monthly Rent"
                name = 'monthlyRent'
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                type="number"
                label="Due Day Of Month"
                name = 'dueDay'
                min="1"
                max="28"
                value={dueDay}
                onchange={handleChange}>
            </lightning-input>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-m-top_small">
                    {errorMessage}
                </div>
            </template>

        </div>
    </lightning-card>
    <template if:true={showAssetConflict}>
        <div class="slds-text-color_error">{assetConflictMessage}</div>
    </template>
</template>
